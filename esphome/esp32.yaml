esphome:
  name: esp32
  friendly_name: ESP32

esp32:
  board: esp32dev
  framework:
    type: arduino

safe_mode:
  reboot_timeout: 30s

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA firmware updates
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi connection — store credentials in secrets.yaml, never hardcode here
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# I2C bus — used for LCD1602 display
i2c:
  sda: 21
  scl: 22
  scan: True
  frequency: 300kHz

# Global variable for LCD page tracking
globals:
  - id: lcd_page
    type: int
    restore_value: no
    initial_value: '0'

# Page switching: cycles between page 0 and page 1 every 2 seconds
interval:
  - interval: 2s
    then:
      - lambda: |-
          id(lcd_page)++;
          if (id(lcd_page) > 1) id(lcd_page) = 0;

# LCD1602 (16x2 character display via I2C PCF8574 backpack)
# Page 0: Voltage, Current, Active Power
# Page 1: Cumulative Energy, Power Factor
display:
  - platform: lcd_pcf8574
    dimensions: 16x2
    address: 0x27
    update_interval: 1s
    lambda: |-
      if (id(lcd_page) == 0) {
        it.printf(0, 0, "V:%.1fV I:%.2fA", id(pzem_voltage).state, id(pzem_current).state);
        it.printf(0, 1, "P:%.1fW", id(pzem_power).state);
      } else if (id(lcd_page) == 1) {
        it.printf(0, 0, "E:%.0fWh", id(pzem_energy).state);
        it.printf(0, 1, "PF:%.2f", id(pzem_power_factor).state);
      }

# UART interface for PZEM-004T (Modbus RTU, 9600 baud)
uart:
  tx_pin: 2
  rx_pin: 4
  baud_rate: 9600

# PZEM-004T energy meter sensors
# All parameters polled every 10 seconds via Modbus RTU at address 0x01
sensor:
  - platform: pzemac
    address: 0x01
    voltage:
      name: "Pzem_voltage"
      id: pzem_voltage
    current:
      name: "Pzem_current"
      id: pzem_current
    power:
      name: "Pzem_power"
      id: pzem_power
    energy:
      name: "Pzem_energy"
      id: pzem_energy
    power_factor:
      name: "Pzem_factor"
      id: pzem_power_factor
    update_interval: 10s

# Relay switch on GPIO5
# inverted: true  → relay activates on LOW signal
# open_drain: true → pin is only pulled LOW or released, never driven HIGH
switch:
  - platform: gpio
    name: "Relay Control"
    id: relay
    pin:
      number: GPIO5
      inverted: true
      mode:
        output: True
        open_drain: True

captive_portal:
